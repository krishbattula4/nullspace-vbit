name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nullspace
          POSTGRES_PASSWORD: nullspace
          POSTGRES_DB: nullspace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nullspace -d nullspace_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - name: Migrations apply cleanly to an empty PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://nullspace:nullspace@localhost:5432/nullspace_test
        run: alembic upgrade head
      - name: Tests against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://nullspace:nullspace@localhost:5432/nullspace_test
          JWT_SECRET: ci-secret
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
